name: Release

# 打 v* tag 发布正式版；手动触发时在 inputs.tagName 上创建 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Release tag（如 v0.1.0）'
        required: true

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tagName || github.ref_name }}
          releaseName: 'DSH Desktop ${{ inputs.tagName || github.ref_name }}'
          releaseBody: 'DeepSeek Harness 桌面端：托管内核源码、随时更新并本地运行。安装包未签名公证，下载后需执行 xattr -cr "/Applications/DSH Desktop.app" 移除隔离标记，否则 macOS 会误报「已损坏」。'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

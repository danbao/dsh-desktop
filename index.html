<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH Desktop</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <span class="logo">⌘</span>
          <span class="name">DSH Desktop</span>
        </div>
        <span id="status-pill" class="pill pill-idle">加载中…</span>
        <div class="spacer"></div>
        <button id="btn-app" class="btn btn-ghost" aria-pressed="false" disabled>打开工作台</button>
        <button id="btn-check-update" class="btn btn-ghost">检查更新</button>
      </header>
      <main id="main">
        <!-- Console view -->
        <section id="console-view">
          <div class="cards">
            <div class="card">
              <div class="card-title-row">
                <h3>环境</h3>
                <span id="env-ready-dot" class="env-dot" aria-hidden="true"></span>
              </div>
              <dl id="env-info" class="kv"><dt>检测中…</dt></dl>
              <div class="card-actions">
                <button id="btn-refresh-toolchain" class="btn btn-small">重新检测</button>
                <button id="btn-toggle-toolchain" class="btn btn-small btn-ghost" aria-expanded="false">工具链设置</button>
              </div>
              <div id="toolchain-settings" class="toolchain-settings hidden">
                <p class="settings-hint">留空时自动读取登录 shell 与常见版本管理器。</p>
                <label class="tool-path-field">
                  <span>Node 可执行文件</span>
                  <span class="path-control">
                    <input id="node-path-input" type="text" placeholder="自动检测" spellcheck="false" />
                    <button id="btn-pick-node" class="btn btn-small" type="button">选择…</button>
                  </span>
                </label>
                <label class="tool-path-field">
                  <span>pnpm 可执行文件</span>
                  <span class="path-control">
                    <input id="pnpm-path-input" type="text" placeholder="自动检测" spellcheck="false" />
                    <button id="btn-pick-pnpm" class="btn btn-small" type="button">选择…</button>
                  </span>
                </label>
                <p id="toolchain-running-hint" class="settings-hint hidden">请先停止服务，再保存工具链设置。</p>
                <div class="settings-actions">
                  <button id="btn-cancel-toolchain" class="btn btn-small btn-ghost" type="button">取消</button>
                  <button id="btn-save-toolchain" class="btn btn-small btn-primary" type="button">保存并检测</button>
                </div>
              </div>
            </div>
            <div class="card">
              <h3>Harness 内核（deepseek-harness）</h3>
              <dl id="harness-info" class="kv"><dt>检测中…</dt></dl>
              <div class="card-actions">
                <button id="btn-sync" class="btn">检查更新</button>
                <button id="btn-update" class="btn btn-primary">更新代码并构建</button>
              </div>
            </div>
            <div class="card">
              <h3>服务</h3>
              <dl id="service-info" class="kv"><dt>—</dt></dl>
              <div class="card-actions">
                <label class="port-label">端口
                  <input id="port-input" type="number" min="1024" max="65535" />
                </label>
                <button id="btn-save-port" class="btn btn-small">保存端口</button>
                <button id="btn-start" class="btn btn-primary">启动服务</button>
                <button id="btn-stop" class="btn btn-danger">停止服务</button>
              </div>
            </div>
            <div class="card">
              <div class="card-title-row">
                <h3>插件</h3>
                <span id="plugin-ready-dot" class="env-dot" aria-hidden="true"></span>
              </div>
              <dl id="plugin-info" class="kv"><dt>状态</dt><dd>读取中…</dd></dl>
              <div class="card-actions">
                <button id="btn-toggle-plugins" class="btn" type="button" aria-expanded="false">管理插件</button>
              </div>
            </div>
          </div>
          <section id="plugin-manager" class="plugin-manager hidden" aria-labelledby="plugin-manager-title">
            <div class="plugin-manager-head">
              <div>
                <p class="plugin-eyebrow">WEB PROFILE / PACKAGE MANIFEST</p>
                <h2 id="plugin-manager-title">插件管理</h2>
                <p class="plugin-intro">安装到桌面端使用的 web profile。变更时会自动停服，并在完成后恢复。</p>
              </div>
              <div class="plugin-manager-actions">
                <button id="btn-check-plugin-updates" class="btn btn-small" type="button">检查更新</button>
                <button id="btn-close-plugins" class="btn btn-small btn-ghost" type="button">收起</button>
              </div>
            </div>
            <div id="plugin-manager-status" class="plugin-manager-status" role="status"></div>
            <div id="plugin-list" class="plugin-list"></div>
            <form id="custom-plugin-form" class="custom-plugin-form">
              <div>
                <label for="custom-plugin-spec">安装自定义 npm 插件</label>
                <p>仅接受包名、精确版本或 dist-tag；不支持 Git、URL 和本地路径。</p>
              </div>
              <div class="custom-plugin-control">
                <input id="custom-plugin-spec" type="text" placeholder="例如 dsh-ringcentral@0.3.3" autocomplete="off" spellcheck="false" />
                <button id="btn-install-custom-plugin" class="btn btn-primary" type="submit">安装</button>
              </div>
            </form>
          </section>
          <div class="log-wrap">
            <div class="log-head">
              <span>日志</span>
              <button id="btn-copy-log" class="btn btn-small btn-ghost">复制全部</button>
              <button id="btn-clear-log" class="btn btn-small btn-ghost">清空</button>
            </div>
            <div id="log-pane" class="log-pane" role="log" aria-live="off"></div>
          </div>
        </section>
      </main>
      <div id="toast" class="toast hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
